name: Extract iOS 26.7 Bluetooth Userspace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: macos-15
    timeout-minutes: 120

    env:
      DEVICE: iPhone14,7
      MODEL: D27AP
      VERSION: "26.7"
      BUILD: 23H24
      OTA_URL: https://updates.cdn-apple.com/2026FallFCS/434fe5ee-beb3-45a3-b344-fb3fe4cc3192/com_apple_MobileAsset_SoftwareUpdate/c469d60a9a92d6417070a00f2e3cfe997a714fc3438279b892566f71b65d8154.aea
      OTA_NAME: c469d60a9a92d6417070a00f2e3cfe997a714fc3438279b892566f71b65d8154.aea
      OTA_SHA256: 6aae8589548e024bca4bcb732b3cd6848c57475df21a2d7b2c3e34a11b244191
      PATTERN: '(?i)(bluetooth|bluetool|bluetoothd|bluetoothuserd|bluetoothaudiod|btserver|mobilebluetooth|iobluetooth|bluetoothmanager)'

    steps:
      - name: Prepare macOS runner
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          uname -a
          df -h
          ROOT="$RUNNER_TEMP/iphone-research"
          mkdir -p "$ROOT/reports" "$ROOT/extracted" "$ROOT/keys" "$ROOT/download"

      - name: Install blacktop ipsw
        shell: bash
        run: |
          set -euxo pipefail
          brew tap blacktop/tap
          brew trust blacktop/tap
          brew install --formula blacktop/tap/ipsw
          ipsw version 2>&1 | tee "$RUNNER_TEMP/iphone-research/reports/ipsw-version.txt"

      - name: Download exact 26.7 OTA locally on the cloud Mac
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/iphone-research"
          OTA="$ROOT/download/$OTA_NAME"

          curl -L --fail --retry 8 --retry-delay 3 --show-error \
            -o "$OTA" "$OTA_URL"

          stat -f '%z %N' "$OTA" | tee "$ROOT/reports/ota-size.txt"
          shasum -a 256 "$OTA" | tee "$ROOT/reports/ota-sha256.txt"

          CALC="$(shasum -a 256 "$OTA" | awk '{print $1}')"
          if [ "$CALC" != "$OTA_SHA256" ]; then
            echo "SHA256 mismatch: expected $OTA_SHA256 got $CALC" | tee "$ROOT/reports/ota-verify-error.txt"
            exit 1
          fi

          echo "SHA256 MATCH" | tee "$ROOT/reports/ota-verify-status.txt"
          df -h | tee "$ROOT/reports/disk-after-download.txt"

      - name: Build Apple OTA AEA key database
        shell: bash
        run: |
          set -o pipefail
          ROOT="$RUNNER_TEMP/iphone-research"
          cd "$ROOT/keys"

          ipsw download ota \
            --platform ios \
            --device "$DEVICE" \
            --version "$VERSION" \
            --fcs-keys \
            --no-color \
            > "$ROOT/reports/keydb.stdout.txt" \
            2> "$ROOT/reports/keydb.stderr.txt"

          STATUS=$?
          echo "$STATUS" > "$ROOT/reports/keydb-exit-code.txt"

          KEYDB="$(find "$ROOT/keys" -name ota_fcs_keys.json -type f -print -quit)"
          if [ -z "$KEYDB" ]; then
            echo "ota_fcs_keys.json was not created" | tee "$ROOT/reports/keydb-not-found.txt"
            exit 1
          fi

          echo "$KEYDB" > "$ROOT/reports/keydb-path.txt"
          shasum -a 256 "$KEYDB" > "$ROOT/reports/keydb-sha256.txt"

      - name: Extract Bluetooth userspace from local AEA OTA
        id: extract
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ROOT="$RUNNER_TEMP/iphone-research"
          OTA="$ROOT/download/$OTA_NAME"
          KEYDB="$(cat "$ROOT/reports/keydb-path.txt")"

          ipsw ota extract "$OTA" \
            --pattern "$PATTERN" \
            --confirm \
            --key-db "$KEYDB" \
            --output "$ROOT/extracted" \
            --no-color \
            > "$ROOT/reports/extraction.stdout.txt" \
            2> "$ROOT/reports/extraction.stderr.txt"

          STATUS=$?
          echo "$STATUS" > "$ROOT/reports/extraction-exit-code.txt"
          exit "$STATUS"

      - name: Inventory and package results
        if: always()
        shell: bash
        run: |
          set -u
          ROOT="$RUNNER_TEMP/iphone-research"

          {
            echo "DEVICE=$DEVICE"
            echo "MODEL=$MODEL"
            echo "VERSION=$VERSION"
            echo "BUILD=$BUILD"
            echo "PATTERN=$PATTERN"
            echo
            echo "EXTRACTED FILES"
            echo "==============="
            find "$ROOT/extracted" -type f -print | sort || true
          } > "$ROOT/reports/file-list.txt"

          : > "$ROOT/reports/SHA256SUMS.txt"
          : > "$ROOT/reports/file-sizes.txt"

          while IFS= read -r -d '' f; do
            shasum -a 256 "$f" >> "$ROOT/reports/SHA256SUMS.txt" || true
            stat -f '%z %N' "$f" >> "$ROOT/reports/file-sizes.txt" || true
          done < <(find "$ROOT/extracted" -type f -print0 2>/dev/null)

          COUNT="$(find "$ROOT/extracted" -type f | wc -l | tr -d ' ')"
          echo "$COUNT" > "$ROOT/reports/extracted-file-count.txt"

          df -h > "$ROOT/reports/final-disk-space.txt"

          cd "$ROOT"
          /usr/bin/zip -r -9 bluetooth-userspace-result.zip reports extracted >/dev/null

      - name: Upload result ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-26.7-23H24-iPhone14_7-bluetooth-userspace-local-ota
          path: ${{ runner.temp }}/iphone-research/bluetooth-userspace-result.zip
          if-no-files-found: error
          retention-days: 7
