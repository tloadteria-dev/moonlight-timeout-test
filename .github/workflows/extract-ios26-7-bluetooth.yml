name: Extract iOS 26.7 Bluetooth Userspace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: macos-15
    timeout-minutes: 120

    env:
      DEVICE: iPhone14,7
      MODEL: D27AP
      VERSION: "26.7"
      BUILD: 23H24
      PATTERN: '(?i)(bluetooth|bluetool|bluetoothd|bluetoothuserd|bluetoothaudiod|btserver|mobilebluetooth|iobluetooth|bluetoothmanager)'

    steps:
      - name: Show runner information
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          uname -a
          df -h
          mkdir -p "$RUNNER_TEMP/iphone-research/reports"
          mkdir -p "$RUNNER_TEMP/iphone-research/extracted"

      - name: Install blacktop ipsw
        shell: bash
        run: |
          set -euxo pipefail
          brew install blacktop/tap/ipsw
          ipsw version 2>&1 | tee "$RUNNER_TEMP/iphone-research/reports/ipsw-version.txt" || \
          ipsw --version 2>&1 | tee "$RUNNER_TEMP/iphone-research/reports/ipsw-version.txt"

      - name: Record exact OTA metadata
        shell: bash
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/iphone-research"
          ipsw download ota \
            --platform ios \
            --device "$DEVICE" \
            --model "$MODEL" \
            --version "$VERSION" \
            --build "$BUILD" \
            --json \
            > reports/ota-metadata.json 2> reports/ota-metadata.stderr.txt
          echo $? > reports/ota-metadata-exit-code.txt

      - name: Extract Bluetooth-related files remotely on macOS
        id: extract
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/iphone-research"

          ipsw download ota \
            --platform ios \
            --device "$DEVICE" \
            --model "$MODEL" \
            --version "$VERSION" \
            --build "$BUILD" \
            --pattern "$PATTERN" \
            --output "$RUNNER_TEMP/iphone-research/extracted" \
            --confirm \
            > reports/extraction.stdout.txt \
            2> reports/extraction.stderr.txt

          STATUS=$?
          echo "$STATUS" > reports/extraction-exit-code.txt
          exit "$STATUS"

      - name: Inventory and hash anything extracted
        if: always()
        shell: bash
        run: |
          set -u
          ROOT="$RUNNER_TEMP/iphone-research"

          {
            echo "DEVICE=$DEVICE"
            echo "MODEL=$MODEL"
            echo "VERSION=$VERSION"
            echo "BUILD=$BUILD"
            echo "PATTERN=$PATTERN"
            echo
            echo "EXTRACTED FILES"
            echo "==============="
            find "$ROOT/extracted" -type f -print | sort || true
          } > "$ROOT/reports/file-list.txt"

          find "$ROOT/extracted" -type f -print0 2>/dev/null | \
            sort -z | \
            xargs -0 shasum -a 256 \
            > "$ROOT/reports/SHA256SUMS.txt" 2>/dev/null || true

          find "$ROOT/extracted" -type f -exec stat -f '%z %N' {} \; 2>/dev/null | \
            sort > "$ROOT/reports/file-sizes.txt" || true

          df -h > "$ROOT/reports/final-disk-space.txt"

          cd "$ROOT"
          /usr/bin/zip -r -9 bluetooth-userspace-result.zip reports extracted >/dev/null

      - name: Upload result ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-26.7-23H24-iPhone14_7-bluetooth-userspace
          path: ${{ runner.temp }}/iphone-research/bluetooth-userspace-result.zip
          if-no-files-found: error
          retention-days: 7
