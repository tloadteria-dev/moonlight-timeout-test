name: cute phone thingy test
on:
  workflow_dispatch:
jobs:
  synthetic-passcode-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python -m unittest -v test_fun_testing_phone_thing.py
      - name: Simulated passcode removal and unlock
        run: python fun_testing_phone_thing.py --mode vulnerable --out cute-phone-vulnerable.json
      - name: Patched rejection control
        run: python fun_testing_phone_thing.py --mode patched --out cute-phone-patched.json
      - uses: actions/upload-artifact@v4
        with:
          name: cute-phone-thingy-test-results
          path: |
            cute-phone-vulnerable.json
            cute-phone-patched.json
